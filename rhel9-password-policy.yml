---
# ============================================================================
# RHEL 9 - Password & Account Security Policy Enforcement Playbook
# ============================================================================
# Applies password complexity, account lockout, login timeout, and session
# policies in an idempotent manner on RHEL 9 targets.
#
# Usage:
#   ansible-playbook -i inventory rhel9-password-policy.yml
# ============================================================================

- name: Apply Password and Account Security Policies on RHEL 9
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify target is RHEL 9
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
          - ansible_distribution_major_version == "9"
        fail_msg: "This playbook is designed for RHEL 9 only. Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}"
        success_msg: "Target confirmed as RHEL {{ ansible_distribution_version }}"

  roles:
    - password_policy
