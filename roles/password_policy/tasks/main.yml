---
# ========================================================================
# 1. Password Complexity - /etc/security/pwquality.conf
# ========================================================================
- name: Set minlen in pwquality.conf
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^#?\s*minlen\s*='
    line: "minlen = {{ pwquality_minlen }}"
    state: present
    backup: true
  tags:
    - password_complexity
    - pwquality

- name: Set minclass in pwquality.conf
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^#?\s*minclass\s*='
    line: "minclass = {{ pwquality_minclass }}"
    state: present
  tags:
    - password_complexity
    - pwquality

- name: Set dictcheck in pwquality.conf
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^#?\s*dictcheck\s*='
    line: "dictcheck = {{ pwquality_dictcheck }}"
    state: present
  tags:
    - password_complexity
    - pwquality

- name: Set dcredit in pwquality.conf
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^#?\s*dcredit\s*='
    line: "dcredit = {{ pwquality_dcredit }}"
    state: present
  tags:
    - password_complexity
    - pwquality

- name: Set ucredit in pwquality.conf
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^#?\s*ucredit\s*='
    line: "ucredit = {{ pwquality_ucredit }}"
    state: present
  tags:
    - password_complexity
    - pwquality

- name: Set lcredit in pwquality.conf
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^#?\s*lcredit\s*='
    line: "lcredit = {{ pwquality_lcredit }}"
    state: present
  tags:
    - password_complexity
    - pwquality

- name: Set ocredit in pwquality.conf
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^#?\s*ocredit\s*='
    line: "ocredit = {{ pwquality_ocredit }}"
    state: present
  tags:
    - password_complexity
    - pwquality

- name: Set maxrepeat in pwquality.conf
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^#?\s*maxrepeat\s*='
    line: "maxrepeat = {{ pwquality_maxrepeat }}"
    state: present
  tags:
    - password_complexity
    - pwquality

# ========================================================================
# 2. Security Faillock - /etc/security/faillock.conf
# ========================================================================
- name: Set deny in faillock.conf
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^#?\s*deny\s*='
    line: "deny = {{ faillock_deny }}"
    state: present
    backup: true
  tags:
    - faillock
    - account_lockout

- name: Set fail_interval in faillock.conf
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^#?\s*fail_interval\s*='
    line: "fail_interval = {{ faillock_fail_interval }}"
    state: present
  tags:
    - faillock
    - account_lockout

- name: Set unlock_time in faillock.conf
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^#?\s*unlock_time\s*='
    line: "unlock_time = {{ faillock_unlock_time }}"
    state: present
  tags:
    - faillock
    - account_lockout

# ========================================================================
# 3. Password Age - /etc/login.defs
# ========================================================================
- name: Set PASS_MIN_DAYS in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MIN_DAYS'
    line: "PASS_MIN_DAYS\t{{ pass_min_days }}"
    state: present
  tags:
    - password_age

- name: Set PASS_MAX_DAYS in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MAX_DAYS'
    line: "PASS_MAX_DAYS\t{{ pass_max_days }}"
    state: present
  tags:
    - password_age

# ========================================================================
# 4. Password Length - /etc/login.defs
# ========================================================================
- name: Set PASS_MIN_LEN in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MIN_LEN'
    line: "PASS_MIN_LEN\t{{ pass_min_len }}"
    state: present
  tags:
    - password_length

- name: Remove any existing PASS_MAX_LEN from login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MAX_LEN'
    state: absent
  tags:
    - password_length

- name: Add PASS_MAX_LEN to login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    line: "PASS_MAX_LEN\t{{ pass_max_len }}"
    state: present
    insertafter: EOF
  tags:
    - password_length

# ========================================================================
# 5. Password History - /etc/pam.d/system-auth
# ========================================================================
- name: Ensure remember={{ password_remember }} is set on pam_unix.so in system-auth
  ansible.builtin.replace:
    path: /etc/pam.d/system-auth
    regexp: '(password\s+.*pam_unix\.so.*)(?<!\bremember=\d+)$'
    replace: '\1 remember={{ password_remember }}'
    backup: true
  tags:
    - password_history

# ========================================================================
# 6. Account Lockout via PAM faillock - /etc/pam.d/system-auth
# ========================================================================
- name: Check if pam_faillock.so is already configured in system-auth
  ansible.builtin.shell:
    cmd: grep -q "pam_faillock.so" /etc/pam.d/system-auth
  register: faillock_check
  changed_when: false
  failed_when: false
  tags:
    - account_lockout

- name: Add pam_faillock.so entries to system-auth
  ansible.builtin.blockinfile:
    path: /etc/pam.d/system-auth
    block: |
      auth required pam_faillock.so preauth silent deny={{ faillock_deny }} unlock_time={{ faillock_unlock_time }} fail_interval={{ faillock_fail_interval }}
      auth [success=1 default=bad] pam_unix.so
      auth [default=die] pam_faillock.so authfail deny={{ faillock_deny }} unlock_time={{ faillock_unlock_time }} fail_interval={{ faillock_fail_interval }}
      account required pam_faillock.so
    marker: "# {mark} ANSIBLE MANAGED - PAM FAILLOCK"
    insertafter: EOF
    backup: true
  when: faillock_check.rc != 0
  tags:
    - account_lockout

# ========================================================================
# 7. Account Logout Duration - /etc/systemd/logind.conf
# ========================================================================
- name: Enable KillUserProcesses in logind.conf
  ansible.builtin.lineinfile:
    path: /etc/systemd/logind.conf
    regexp: '^#?KillUserProcesses='
    line: "KillUserProcesses=yes"
    state: present
    backup: true
  notify: Restart systemd-logind
  tags:
    - session_logout

# ========================================================================
# 8. Login Timeout - /etc/login.defs
# ========================================================================
- name: Set LOGIN_TIMEOUT in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^LOGIN_TIMEOUT'
    line: "LOGIN_TIMEOUT\t{{ login_timeout }}"
    state: present
  tags:
    - login_timeout
